<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#3A3327">
<title>Herd Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDE6D6;
    --card:#FBF8F0;
    --ink:#2B2A25;
    --ink-soft:#6B6455;
    --line:#C9BFA8;
    --rust:#A8461F;
    --rust-soft:#F1DCCD;
    --green:#445B3C;
    --green-soft:#DCE4D5;
    --slate:#4B5A67;
    --slate-soft:#DCE3E6;
    --gray-soft:#E4E0D4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding-bottom:90px;
    min-height:100vh;
  }
  header.top{
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    padding:22px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  header.top h1{
    font-family:'Bitter',serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 2px;
    letter-spacing:-0.01em;
  }
  header.top .sub{
    font-size:13px;
    color:var(--ink-soft);
  }
  .search{
    margin-top:14px;
    display:flex;
    gap:8px;
  }
  .search input{
    flex:1;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:10px;
    padding:10px 12px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  main{padding:16px 16px 20px;}
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .tag{
    display:inline-block;
    border:2px solid var(--line);
    border-radius:50%;
    width:56px;height:56px;
    line-height:52px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    margin-bottom:14px;
  }
  .cow-list{display:flex;flex-direction:column;gap:10px;}
  .cow-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
  }
  .ear-tag{
    flex:none;
    width:46px;height:36px;
    border-radius:8px;
    background:var(--gray-soft);
    border:1.5px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:13px;
    position:relative;
  }
  .ear-tag::before{
    content:'';
    position:absolute;
    left:-5px; top:50%; transform:translateY(-50%);
    width:7px;height:7px;
    background:var(--bg);
    border:1.5px solid var(--ink);
    border-radius:50%;
  }
  .cow-info{flex:1; min-width:0;}
  .cow-name{font-weight:600; font-size:16px;}
  .cow-genetics{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .cow-status{margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;}
  .pill{
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .pill.bred{background:var(--slate-soft); color:var(--slate);}
  .pill.pregnant{background:var(--green-soft); color:var(--green);}
  .pill.open{background:var(--gray-soft); color:var(--ink-soft);}
  .pill.lost{background:var(--rust-soft); color:var(--rust);}
  .pill.calved{background:var(--green-soft); color:var(--green);}
  .pill.due{background:var(--rust-soft); color:var(--rust);}
  .chev{color:var(--line); font-size:20px;}

  .fab{
    position:fixed;
    right:20px; bottom:24px;
    width:58px;height:58px;
    border-radius:50%;
    background:var(--ink);
    color:var(--bg);
    border:none;
    font-size:28px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(43,42,37,0.3);
    z-index:20;
  }

  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(43,42,37,0.45);
    z-index:30;
    display:none;
  }
  .sheet-backdrop.show{display:block;}
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--bg);
    border-radius:20px 20px 0 0;
    max-height:88vh;
    overflow-y:auto;
    z-index:31;
    transform:translateY(100%);
    transition:transform .25s ease;
    padding:20px 20px 30px;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{
    width:36px;height:4px;
    background:var(--line);
    border-radius:2px;
    margin:0 auto 16px;
  }
  .sheet h2{
    font-family:'Bitter',serif;
    font-size:20px;
    margin:0 0 16px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:10px;
    padding:11px 12px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .btn{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    font-size:15px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .btn-primary{background:var(--ink); color:var(--bg); margin-top:6px;}
  .btn-secondary{background:transparent; color:var(--ink-soft); margin-top:8px; border:1px solid var(--line);}
  .btn-danger{background:transparent; color:var(--rust); margin-top:8px; border:1px solid var(--rust-soft);}

  .detail-header{
    display:flex; align-items:center; gap:14px; margin-bottom:6px;
  }
  .back-btn{
    border:none; background:none; font-size:22px; color:var(--ink);
    padding:4px 8px 4px 0; cursor:pointer;
  }
  .detail-name{font-family:'Bitter',serif; font-weight:700; font-size:22px;}
  .detail-genetics{color:var(--ink-soft); font-size:13.5px; margin:2px 0 0;}
  .section-label{
    font-size:12px; font-weight:600; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-soft);
    margin:22px 0 10px;
  }
  .record{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .record-top{display:flex; justify-content:space-between; align-items:center;}
  .record-date{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft);}
  .record-sire{font-size:14px; margin-top:3px;}
  .record-meta{font-size:12px; color:var(--ink-soft); margin-top:4px;}

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg);
    padding:10px 18px; border-radius:20px; font-size:13.5px;
    z-index:40; opacity:0; transition:opacity .2s ease; pointer-events:none;
  }
  .toast.show{opacity:1;}
  .conditional{display:none;}
  .conditional.show{display:block;}
  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  .loading{text-align:center; padding:40px; color:var(--ink-soft); font-size:13.5px;}
</style>
</head>
<body>

<header class="top" id="topHeader">
  <h1>Herd Book</h1>
  <div class="sub" id="headerSub">Breeding &amp; calving records</div>
  <div class="search" id="searchWrap">
    <input type="text" id="searchInput" placeholder="Search by name or ear tag...">
  </div>
</header>

<main id="main">
  <div class="loading">Loading herd...</div>
</main>

<button class="fab" id="fabAdd">+</button>

<div class="sheet-backdrop" id="backdrop"></div>

<!-- Add/Edit Cow Sheet -->
<div class="sheet" id="cowSheet">
  <div class="sheet-handle"></div>
  <h2 id="cowSheetTitle">Add Cow</h2>
  <input type="hidden" id="cowId">
  <div class="field">
    <label>Name / ID</label>
    <input type="text" id="cowName" placeholder="e.g. Daisy or Tag #14">
  </div>
  <div class="field">
    <label>Genetics</label>
    <input type="text" id="cowGenetics" placeholder="e.g. Angus x Hereford">
  </div>
  <div class="field">
    <label>Notes</label>
    <textarea id="cowNotes" placeholder="Optional"></textarea>
  </div>
  <button class="btn btn-primary" id="saveCowBtn">Save Cow</button>
  <button class="btn btn-secondary" id="cancelCowBtn">Cancel</button>
</div>

<!-- Add/Edit Breeding Sheet -->
<div class="sheet" id="breedSheet">
  <div class="sheet-handle"></div>
  <h2 id="breedSheetTitle">New Breeding Record</h2>
  <input type="hidden" id="breedId">
  <input type="hidden" id="breedAnimalId">
  <div class="field">
    <label>Bred To (Sire)</label>
    <input type="text" id="sireInput" placeholder="Bull name / registration">
  </div>
  <div class="row2">
    <div class="field">
      <label>Date Bred</label>
      <input type="date" id="dateBred">
    </div>
    <div class="field">
      <label>Est. Calving Date</label>
      <input type="date" id="estCalving">
    </div>
  </div>
  <div class="hint">Estimated calving auto-fills at 283 days — adjust if needed.</div>
  <div class="field" style="margin-top:14px;">
    <label>Result</label>
    <select id="resultSelect">
      <option value="Bred">Bred / Pending</option>
      <option value="Confirmed Pregnant">Confirmed Pregnant</option>
      <option value="Open">Open (Not Pregnant)</option>
      <option value="Lost">Lost / Aborted</option>
      <option value="Calved">Calved</option>
    </select>
  </div>
  <div class="conditional" id="calvedFields">
    <div class="row2">
      <div class="field">
        <label>Actual Calving Date</label>
        <input type="date" id="actualCalving">
      </div>
      <div class="field">
        <label>Calf Sex</label>
        <select id="calfSex">
          <option value="">—</option>
          <option value="Heifer (F)">Heifer (F)</option>
          <option value="Bull (M)">Bull (M)</option>
        </select>
      </div>
    </div>
  </div>
  <div class="field">
    <label>Notes</label>
    <textarea id="breedNotes" placeholder="Optional"></textarea>
  </div>
  <button class="btn btn-primary" id="saveBreedBtn">Save Record</button>
  <button class="btn btn-secondary" id="cancelBreedBtn">Cancel</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============ */
// Paste your Apps Script Web App URL here after deploying Code.gs
const API_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
const GESTATION_DAYS = 283;
const CACHE_KEY = 'herdbook_cache_v1';

/* ============ STATE ============ */
let state = { animals: [], breeding: [] };
let view = { screen: 'home', animalId: null };

/* ============ HELPERS ============ */
function $(id){ return document.getElementById(id); }
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function addDays(dateStr, days){
  const dt = new Date(dateStr + 'T00:00:00');
  dt.setDate(dt.getDate() + days);
  return dt.toISOString().slice(0,10);
}
function daysUntil(dateStr){
  const now = new Date(); now.setHours(0,0,0,0);
  const dt = new Date(dateStr + 'T00:00:00');
  return Math.round((dt - now) / 86400000);
}
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function saveCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadCache(){
  try{
    const c = localStorage.getItem(CACHE_KEY);
    if(c){ state = JSON.parse(c); return true; }
  }catch(e){}
  return false;
}

/* ============ API ============ */
async function apiCall(action, payload){
  if(API_URL.indexOf('PASTE_YOUR') === 0){
    showToast('Set your Apps Script URL in the code first');
    return null;
  }
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify(Object.assign({action:action}, payload||{}))
    });
    return await res.json();
  }catch(e){
    showToast('Network error — check connection');
    return null;
  }
}
async function loadAll(){
  const hadCache = loadCache();
  if(hadCache) render();
  else $('main').innerHTML = '<div class="loading">Loading herd...</div>';

  const data = await apiCall('getAll');
  if(data && !data.error){
    state = data;
    saveCache();
    render();
  } else if(!hadCache){
    $('main').innerHTML = '<div class="empty">Couldn\'t load data.<br>Check your connection or setup.</div>';
  }
}

/* ============ STATUS LOGIC ============ */
function latestBreedingFor(animalId){
  const recs = state.breeding.filter(b => String(b.AnimalID) === String(animalId));
  if(!recs.length) return null;
  return recs.slice().sort((a,b)=> new Date(b.DateBred) - new Date(a.DateBred))[0];
}
function statusPillHtml(rec){
  if(!rec) return '<span class="pill open">No records</span>';
  const r = rec.Result || 'Bred';
  const map = { 'Bred':'bred', 'Confirmed Pregnant':'pregnant', 'Open':'open', 'Lost':'lost', 'Calved':'calved' };
  const cls = map[r] || 'open';
  let html = `<span class="pill ${cls}">${r}</span>`;
  if((r === 'Bred' || r === 'Confirmed Pregnant') && rec.EstCalvingDate){
    const d = daysUntil(rec.EstCalvingDate);
    if(d <= 21 && d >= -14){
      const label = d < 0 ? `${Math.abs(d)}d overdue` : (d===0 ? 'Due today' : `Due in ${d}d`);
      html += `<span class="pill due">${label}</span>`;
    }
  }
  return html;
}

/* ============ RENDER: HOME ============ */
function render(){
  if(view.screen === 'home') renderHome();
  else if(view.screen === 'detail') renderDetail(view.animalId);
}

function renderHome(){
  $('topHeader').style.display = 'block';
  const q = ($('searchInput').value || '').toLowerCase();
  const animals = state.animals
    .filter(a => a.Active !== 'N')
    .filter(a => !q || (a.Name||'').toLowerCase().includes(q) || String(a.AnimalID).includes(q))
    .sort((a,b) => (a.Name||'').localeCompare(b.Name||''));

  if(!animals.length){
    $('main').innerHTML = `<div class="empty">
      <div class="tag">＋</div><br>
      No cows yet.<br>Tap the + button to add your first one.
    </div>`;
    return;
  }

  let html = '<div class="cow-list">';
  animals.forEach(a => {
    const rec = latestBreedingFor(a.AnimalID);
    html += `<div class="cow-card" data-id="${a.AnimalID}">
      <div class="ear-tag">${a.AnimalID}</div>
      <div class="cow-info">
        <div class="cow-name">${escapeHtml(a.Name)}</div>
        <div class="cow-genetics">${escapeHtml(a.Genetics||'—')}</div>
        <div class="cow-status">${statusPillHtml(rec)}</div>
      </div>
      <div class="chev">›</div>
    </div>`;
  });
  html += '</div>';
  $('main').innerHTML = html;

  document.querySelectorAll('.cow-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      view = { screen:'detail', animalId: el.dataset.id };
      render();
    });
  });
}

/* ============ RENDER: DETAIL ============ */
function renderDetail(animalId){
  $('topHeader').style.display = 'none';
  const a = state.animals.find(x => String(x.AnimalID) === String(animalId));
  if(!a){ view.screen='home'; render(); return; }

  const recs = state.breeding
    .filter(b => String(b.AnimalID) === String(animalId))
    .sort((x,y) => new Date(y.DateBred) - new Date(x.DateBred));

  let html = `
    <div class="detail-header">
      <button class="back-btn" id="backBtn">‹</button>
      <div>
        <div class="detail-name">${escapeHtml(a.Name)}</div>
        <div class="detail-genetics">${escapeHtml(a.Genetics||'—')} · Tag ${a.AnimalID}</div>
      </div>
    </div>
    ${a.Notes ? `<div class="hint" style="margin-top:8px;">${escapeHtml(a.Notes)}</div>` : ''}
    <div class="section-label">Breeding History</div>`;

  if(!recs.length){
    html += `<div class="hint">No breeding records yet.</div>`;
  } else {
    recs.forEach(r => {
      html += `<div class="record" data-id="${r.RecordID}">
        <div class="record-top">
          <div class="record-date">${fmtDate(r.DateBred)}</div>
          ${statusPillHtml(r)}
        </div>
        <div class="record-sire">Sire: ${escapeHtml(r.Sire||'—')}</div>
        <div class="record-meta">
          Est. calving ${fmtDate(r.EstCalvingDate)}
          ${r.Result==='Calved' ? ` · Calved ${fmtDate(r.ActualCalvingDate)} · ${escapeHtml(r.CalfSex||'')}` : ''}
        </div>
      </div>`;
    });
  }

  html += `<button class="btn btn-secondary" id="editCowBtn" style="margin-top:20px;">Edit Cow Details</button>`;
  $('main').innerHTML = html;

  $('backBtn').addEventListener('click', ()=>{ view={screen:'home',animalId:null}; render(); });
  $('editCowBtn').addEventListener('click', ()=> openCowSheet(a));
  document.querySelectorAll('.record').forEach(el=>{
    el.addEventListener('click', ()=>{
      const rec = recs.find(r => String(r.RecordID) === el.dataset.id);
      openBreedSheet(a, rec);
    });
  });
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ SHEETS ============ */
function openBackdrop(){ $('backdrop').classList.add('show'); }
function closeSheets(){
  $('backdrop').classList.remove('show');
  $('cowSheet').classList.remove('show');
  $('breedSheet').classList.remove('show');
}
$('backdrop').addEventListener('click', closeSheets);

function openCowSheet(animal){
  $('cowSheetTitle').textContent = animal ? 'Edit Cow' : 'Add Cow';
  $('cowId').value = animal ? animal.AnimalID : '';
  $('cowName').value = animal ? animal.Name : '';
  $('cowGenetics').value = animal ? animal.Genetics : '';
  $('cowNotes').value = animal ? animal.Notes : '';
  openBackdrop();
  $('cowSheet').classList.add('show');
}
$('cancelCowBtn').addEventListener('click', closeSheets);

$('saveCowBtn').addEventListener('click', async ()=>{
  const name = $('cowName').value.trim();
  if(!name){ showToast('Enter a name'); return; }
  const id = $('cowId').value;
  const payload = { Name:name, Genetics:$('cowGenetics').value.trim(), Notes:$('cowNotes').value.trim() };
  $('saveCowBtn').textContent = 'Saving...';
  let res;
  if(id){
    payload.AnimalID = id;
    res = await apiCall('updateAnimal', payload);
  } else {
    res = await apiCall('addAnimal', payload);
  }
  $('saveCowBtn').textContent = 'Save Cow';
  if(res && res.success){
    closeSheets();
    showToast('Saved');
    await loadAll();
  } else {
    showToast('Could not save — try again');
  }
});

function openBreedSheet(animal, rec){
  $('breedSheetTitle').textContent = rec ? 'Edit Breeding Record' : `New Record — ${animal.Name}`;
  $('breedId').value = rec ? rec.RecordID : '';
  $('breedAnimalId').value = animal.AnimalID;
  $('sireInput').value = rec ? rec.Sire : '';
  $('dateBred').value = rec ? rec.DateBred : new Date().toISOString().slice(0,10);
  $('estCalving').value = rec ? rec.EstCalvingDate : addDays($('dateBred').value, GESTATION_DAYS);
  $('resultSelect').value = rec ? (rec.Result||'Bred') : 'Bred';
  $('actualCalving').value = rec ? (rec.ActualCalvingDate||'') : '';
  $('calfSex').value = rec ? (rec.CalfSex||'') : '';
  $('breedNotes').value = rec ? (rec.Notes||'') : '';
  toggleCalvedFields();
  openBackdrop();
  $('breedSheet').classList.add('show');
}
$('cancelBreedBtn').addEventListener('click', closeSheets);

$('dateBred').addEventListener('change', ()=>{
  if($('dateBred').value){
    $('estCalving').value = addDays($('dateBred').value, GESTATION_DAYS);
  }
});
function toggleCalvedFields(){
  $('calvedFields').classList.toggle('show', $('resultSelect').value === 'Calved');
}
$('resultSelect').addEventListener('change', toggleCalvedFields);

$('saveBreedBtn').addEventListener('click', async ()=>{
  const animalId = $('breedAnimalId').value;
  const animal = state.animals.find(a => String(a.AnimalID) === String(animalId));
  if(!$('dateBred').value){ showToast('Enter date bred'); return; }
  const payload = {
    AnimalID: animalId,
    AnimalName: animal ? animal.Name : '',
    DateBred: $('dateBred').value,
    Sire: $('sireInput').value.trim(),
    EstCalvingDate: $('estCalving').value,
    Result: $('resultSelect').value,
    ActualCalvingDate: $('actualCalving').value,
    CalfSex: $('calfSex').value,
    Notes: $('breedNotes').value.trim()
  };
  const id = $('breedId').value;
  $('saveBreedBtn').textContent = 'Saving...';
  let res;
  if(id){
    payload.RecordID = id;
    res = await apiCall('updateBreeding', payload);
  } else {
    res = await apiCall('addBreeding', payload);
  }
  $('saveBreedBtn').textContent = 'Save Record';
  if(res && res.success){
    closeSheets();
    showToast('Saved');
    await loadAll();
  } else {
    showToast('Could not save — try again');
  }
});

/* ============ FAB ============ */
$('fabAdd').addEventListener('click', ()=>{
  if(view.screen === 'home'){
    openCowSheet(null);
  } else {
    const a = state.animals.find(x => String(x.AnimalID) === String(view.animalId));
    if(a) openBreedSheet(a, null);
  }
});

/* ============ SEARCH ============ */
$('searchInput').addEventListener('input', ()=>{ if(view.screen==='home') renderHome(); });

/* ============ INIT ============ */
loadAll();
</script>
</body>
</html>
